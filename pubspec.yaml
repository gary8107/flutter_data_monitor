name: data_monitor
description: 可擴充的 App 資料監控器，內建懸浮視窗與 Dio(HTTP) 採集，可自行新增任何監控來源。
version: 0.1.0
publish_to: none

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP 採集用；若你不需要 Dio channel，可自行移除此依賴。
  dio: ">=5.0.0 <6.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=2.0.0"

flutter:
